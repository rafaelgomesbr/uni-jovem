# Rotas extras do site unijovem-hml no Caddy compartilhado. O painel inclui
# este arquivo (sites/extras/unijovem-hml/*.conf) antes do proxy para a API.

# Web interna (Expo exportado): /app/* servido como SPA.
handle /app* {
	root * /srv/sites/unijovem-hml-web
	uri strip_prefix /app
	try_files {path} {path}.html /index.html
	file_server
	header /_expo/* Cache-Control "public, max-age=31536000, immutable"
}

# Links que a API e os e-mails geram sem o prefixo /app. O navegador mantém o
# fragmento (#t=...) no redirecionamento, então o token não passa pelo servidor.
redir /convite /app/convite 302
redir /primeiro-acesso /app/primeiro-acesso 302
redir /redefinir-senha /app/redefinir-senha 302
