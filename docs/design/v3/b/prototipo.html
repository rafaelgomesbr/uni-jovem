<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Uni Jovem: direção B, claro e acolhedor (protótipo)</title>
<!-- Fontes opcionais. Sem internet, valem as reservas locais (Georgia e a fonte do sistema). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Tokens. Escala de espaço: 4 8 12 16 20 24 32 40 48 64.
   Tema claro é o principal; o escuro é o par fiel (noite quente).
   ============================================================ */
:root{
  --fs:1;
  --saida:cubic-bezier(.22,1,.36,1);
  --padrao:cubic-bezier(.4,0,.2,1);
  --saidaTela:cubic-bezier(.4,0,1,1);
  --mola:cubic-bezier(.34,1.5,.64,1);
  --molaCheck:cubic-bezier(.3,1.8,.5,1);
  --ff-t:'Fraunces','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --ff-x:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html[data-tema="claro"]{
  --papel:#FBF5EC;--areia:#F3E9DA;--sup:#FFFFFF;--sup2:#FFF8EE;
  --texto:#2A1F17;--suave:#66554A;
  --coral:#B5421D;--coral-p:#9D3715;--sobre:#FFFFFF;--dest:#9A3412;--quente:#FDE6DA;
  --tonal:#F3E4D0;--contorno:#8A7766;--exemplo:#7A685A;--campo:#FFFFFF;
  --ok:#2E5E45;--ok-f:#E2EFE5;--ok-ic:#3F7A5A;
  --al:#7A4E00;--al-f:#FFF0CC;--er:#A31F3D;--er-f:#FBE4E8;--in:#2D5C88;--in-f:#E0ECF8;
  --neu-f:#EFE4D3;--sep:rgba(120,80,40,.12);--esq:#EFE3D2;--foco:#9A3412;
  --veu:rgba(42,31,23,.45);--card-borda:rgba(120,80,40,.06);
  --off-bg:#E9C7B8;--off-tx:#7A3A22;
  --inv-bg:#2A1F17;--inv-tx:#FBF5EC;--inv-ac:#FFB08C;--tab-bg:#FFFFFF;
  --s-card:0 1px 2px rgba(92,58,28,.06),0 8px 24px rgba(92,58,28,.08);
  --s-flut:0 12px 32px rgba(92,58,28,.16);
  --s-btn:0 6px 16px rgba(181,66,29,.28);
  --s-folha:0 -12px 40px rgba(60,36,16,.22);
  --sol1:#F9B25F;--sol2:#E4693A;--sol-raio:#EE8C45;--sol-barra:#B5421D;--sol-barra2:#D99A86;--sol-glow:rgba(249,178,95,.6);--sol-halo:#EE8C45;
  --pg:#E9DECD;--pg2:#F3EADC;
}
html[data-tema="escuro"]{
  --papel:#1B1511;--areia:#241C17;--sup:#272019;--sup2:#2E251D;
  --texto:#F7EEE3;--suave:#CDBBA9;
  --coral:#EE8A62;--coral-p:#D9764F;--sobre:#2A1209;--dest:#FFB08C;--quente:#4A2E21;
  --tonal:#3A2F26;--contorno:#9A8878;--exemplo:#B3A190;--campo:#332920;
  --ok:#9ADBB4;--ok-f:#23362B;--ok-ic:#6FB88B;
  --al:#F2C46D;--al-f:#3A2E16;--er:#FF9DB0;--er-f:#3D1F29;--in:#9CC7EE;--in-f:#1F3144;
  --neu-f:#3A3027;--sep:rgba(255,236,214,.10);--esq:#352B23;--foco:#FFB08C;
  --veu:rgba(8,5,3,.6);--card-borda:rgba(255,236,214,.09);
  --off-bg:#5A3A2B;--off-tx:#E9B9A3;
  --inv-bg:#F7EEE3;--inv-tx:#2A1F17;--inv-ac:#9A3412;--tab-bg:#2B231C;
  --s-card:none;--s-flut:0 12px 32px rgba(0,0,0,.5);--s-btn:0 6px 16px rgba(238,138,98,.22);--s-folha:0 -12px 40px rgba(0,0,0,.55);
  --sol1:#F4B070;--sol2:#E27B4F;--sol-raio:#E9965C;--sol-barra:#EE8A62;--sol-barra2:#8C5A48;--sol-glow:rgba(244,176,112,.5);--sol-halo:#F4B070;
  --pg:#0F0B09;--pg2:#17110E;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--ff-x);background:var(--pg);color:var(--texto);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Ajustes (fora da moldura) ---------- */
.ajustes{width:100%;background:var(--pg2);border-bottom:1px solid var(--sep);position:sticky;top:0;z-index:300;font-size:15px;line-height:1.3}
.ajustes>summary{display:none;list-style:none}
.aj-in{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:12px 24px}
.aj-g{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aj-g b{font-weight:600}
.seg2{display:inline-flex;background:var(--tonal);border-radius:999px;padding:4px;gap:4px}
.seg2 button{min-height:40px;padding:4px 16px;border-radius:999px;font-weight:600}
.seg2 button[aria-pressed="true"]{background:var(--sup);box-shadow:0 1px 3px rgba(60,36,16,.25)}
.aj-btn{min-height:40px;padding:4px 16px;border-radius:999px;background:var(--tonal);font-weight:600}
.aj-sel{min-height:40px;padding:4px 12px;border-radius:12px;border:1px solid var(--contorno);background:var(--campo)}
.aj-sw{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-weight:600}
.aj-sw i{width:52px;height:32px;border-radius:999px;background:var(--tonal);border:2px solid var(--contorno);position:relative;transition:background-color 140ms}
.aj-sw i::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--contorno);transition:transform 200ms var(--padrao),background-color 140ms}
.aj-sw[aria-checked="true"] i{background:var(--quente);border-color:var(--coral)}
.aj-sw[aria-checked="true"] i::after{transform:translateX(20px);background:var(--coral)}
.aj-r{width:150px;accent-color:var(--coral)}
.aj-v{font-variant-numeric:tabular-nums;min-width:32px}
.aj-dica{font-size:14px;color:var(--suave)}
.ajustes :focus-visible,.stage :focus-visible{outline:3px solid var(--foco);outline-offset:3px}

.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:24px}
.fit{width:calc(390px*var(--sc,1));height:calc(844px*var(--sc,1));flex:none}
.phone{--safe:47px;position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--papel);color:var(--texto);
  transform:scale(var(--sc,1));transform-origin:0 0;isolation:isolate;
  box-shadow:0 0 0 10px #2a211b,0 0 0 11px rgba(255,255,255,.12),0 32px 80px rgba(60,36,16,.4);
  --t-disp:calc(36px*min(var(--fs),1.6));--t-tela:calc(30px*min(var(--fs),1.8));--t-cart:calc(26px*min(var(--fs),2));
  --t-corpo:calc(17px*var(--fs));--t-rot:calc(16px*var(--fs));--t-leg:calc(15px*var(--fs));
  --t-chip:calc(14px*min(var(--fs),1.6));--t-btn:calc(17px*min(var(--fs),2));--t-aba:14px;
  --t-cron:calc(64px*min(var(--fs),1.4));--t-num:calc(34px*min(var(--fs),1.6));
  font-size:var(--t-corpo);line-height:1.5}
.phone.ab-g{--t-aba:calc(14px*min(var(--fs),1.6))}
body.full{min-height:100dvh}
body.full .stage{padding:0}
body.full .fit{width:100vw;height:100dvh}
body.full .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;transform:none;--safe:max(env(safe-area-inset-top),16px)}
body.full .status,body.full .homebar{display:none}
body.full .ajustes{position:fixed;top:6px;right:6px;left:auto;width:auto;background:transparent;border:0}
body.full .ajustes>summary{display:block;padding:6px 12px;border-radius:999px;background:var(--inv-bg);color:var(--inv-tx);font-weight:600;font-size:14px;cursor:pointer;opacity:.92}
body.full .ajustes .aj-in{position:absolute;top:36px;right:0;width:min(92vw,360px);max-height:76vh;overflow:auto;background:var(--pg2);border:1px solid var(--sep);border-radius:20px;box-shadow:var(--s-flut);flex-direction:column;align-items:flex-start}
body.full .ajustes:not([open]) .aj-in{display:none}

/* ---------- Tipografia ---------- */
.h1{font:600 var(--t-disp)/1.12 var(--ff-t);letter-spacing:-.01em;font-variation-settings:'SOFT' 100,'WONK' 0}
.h2{font:600 var(--t-tela)/1.15 var(--ff-t);letter-spacing:-.01em;font-variation-settings:'SOFT' 100,'WONK' 0}
.h3{font:600 var(--t-cart)/1.2 var(--ff-t);font-variation-settings:'SOFT' 100,'WONK' 0}
.corpo{font-size:var(--t-corpo);line-height:1.55}
.item{font:600 var(--t-corpo)/1.35 var(--ff-x)}
.rot{font:600 var(--t-rot)/1.35 var(--ff-x)}
.meta{font-size:var(--t-rot);line-height:1.4;color:var(--suave)}
.leg{font-size:var(--t-leg);line-height:1.4;color:var(--suave)}
.suave{color:var(--suave)}
.tnum{font-variant-numeric:tabular-nums}
.sec{font:600 var(--t-tela)/1.2 var(--ff-t);font-size:calc(22px*min(var(--fs),1.8));margin:0 0 12px;font-variation-settings:'SOFT' 100,'WONK' 0}

/* ---------- Ícones ---------- */
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:20px;height:20px}
.ic.xs{width:16px;height:16px;stroke-width:2.4}
.ic.lg{width:28px;height:28px}

/* ---------- Moldura: status, telas, barra ---------- */
.status{position:absolute;top:0;left:0;right:0;height:var(--safe);z-index:40;background:var(--papel);display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 8px 40px;font:600 16px var(--ff-x);font-variant-numeric:tabular-nums}
.status span{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--texto);opacity:.8;z-index:45;pointer-events:none}
.phone.palco-on .status{background:#0E0B09;color:#FFF6EA}
.phone.palco-on .homebar{background:#FFF6EA}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:var(--safe);background:var(--papel);scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
#tabScreen{z-index:1;padding:var(--safe) 24px 120px}
#stackHost{position:absolute;inset:0;z-index:20;pointer-events:none}
.screen.stack{pointer-events:auto;z-index:2}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:0 24px}
.tabfade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,var(--papel) 35%,transparent);z-index:9;pointer-events:none}
.phone.has-stack .tabfade,.phone.has-stack .tabbar{visibility:hidden}

.tabbar{position:absolute;left:12px;right:12px;bottom:24px;height:72px;z-index:10;border-radius:36px;background:var(--tab-bg);box-shadow:var(--s-flut);border:1px solid var(--card-borda);display:flex;padding:8px 6px}
.tab-pill{position:absolute;top:8px;left:6px;width:calc((100% - 12px)/4);height:56px;border-radius:28px;background:var(--quente);transition:transform 250ms var(--mola)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:28px;color:var(--suave);font:500 var(--t-aba)/1.15 var(--ff-x);min-width:0}
.tab.on{color:var(--dest);font-weight:600}
.tab .ic{width:26px;height:26px}
.tab.on .ic{stroke-width:2.3;fill:rgba(181,66,29,.20)}
html[data-tema="escuro"] .tab.on .ic{fill:rgba(255,176,140,.22)}
.phone.ab-g .tab-pill{display:none}
.phone.ab-g .tab{flex:0 0 auto;width:56px;flex-direction:row;gap:8px;transition:none}
.phone.ab-g .tab .lbl{display:none}
.phone.ab-g .tab.on{flex:1 1 auto;width:auto;background:var(--quente);padding:0 8px}
.phone.ab-g .tab.on .lbl{display:inline}
.phone.ab-g .tabbar{justify-content:space-between}

/* ---------- Cabeçalho ---------- */
.hdr{position:sticky;top:var(--safe);z-index:6;background:var(--papel);display:flex;justify-content:space-between;align-items:center;margin:0 -24px;padding:8px 24px;gap:12px}
.pill{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--sup);box-shadow:var(--s-card);border:1px solid var(--card-borda);max-width:calc(100% - 60px);font:600 var(--t-rot)/1.2 var(--ff-x)}
.pill .pn{min-width:0}
.pill .ic{color:var(--suave)}
.pill.troca .pn{animation:fade 160ms var(--padrao) both}
.pill.troca .av{animation:flip 200ms var(--padrao) both}
.bell{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--sup);box-shadow:var(--s-card);border:1px solid var(--card-borda);flex:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:var(--coral);color:var(--sobre);font:700 14px/24px var(--ff-x);text-align:center;font-variant-numeric:tabular-nums}
.badge.estoura{animation:estoura 160ms var(--saida)}
.av{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff;font:700 16px/1 var(--ff-x);flex:none;letter-spacing:.02em}
.av.s{width:40px;height:40px;font-size:14px}
.av.xs{width:32px;height:32px;font-size:12px}
.av.lg{width:72px;height:72px;font-size:26px}
.faixa{display:flex;gap:12px;align-items:flex-start;margin:4px 0 12px;padding:12px 16px;border-radius:20px;background:var(--al-f);color:var(--al);font:500 var(--t-leg)/1.4 var(--ff-x)}
.faixa .ic{margin-top:2px}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 24px;border-radius:999px;font:600 var(--t-btn)/1.25 var(--ff-x);text-align:center;position:relative;user-select:none;
  transition:transform 160ms var(--mola),background-color 140ms,box-shadow 140ms,opacity 140ms}
.btn:active{transform:scale(.98);transition-duration:90ms}
.btn.g{min-height:56px}
.btn.c{min-height:44px;padding:8px 20px}
.btn.w{width:100%}
.btn.p{background:var(--coral);color:var(--sobre);box-shadow:var(--s-btn)}
.btn.p:hover{background-image:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.08))}
.btn.p:active{background:var(--coral-p);background-image:none;box-shadow:none}
.btn.s{background:var(--tonal);color:var(--texto)}
.btn.s:hover{background-image:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.05))}
.btn.t{color:var(--dest);padding:8px 12px;min-height:44px;background:transparent}
.btn.t:hover{background:var(--quente)}
.btn.er{background:var(--er-f);color:var(--er)}
.btn.erc{background:var(--er);color:var(--papel)}
.btn.okb{background:var(--ok-f);color:var(--ok);box-shadow:none}
.btn[disabled]{box-shadow:none;cursor:not-allowed;transform:none}
.btn.p[disabled]{background:var(--off-bg);color:var(--off-tx);background-image:none}
.btn.s[disabled],.btn.t[disabled]{opacity:.6}
.btn.ld{pointer-events:none}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;opacity:0;animation:giro 800ms linear infinite,fade 140ms linear 250ms forwards}
.pop{display:inline-block;animation:pop 200ms var(--molaCheck) both}
[tabindex="-1"]:focus{outline:none}
.b:has(>.mh:empty){margin-bottom:0}
.par{display:flex;gap:12px}
.par>.btn{flex:1 1 0;min-width:0}
.phone.fg .par{flex-direction:column}
.motivo{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:var(--t-leg);line-height:1.4;color:var(--suave)}
.motivo .ic{margin-top:1px}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--sup);box-shadow:var(--s-card);border:1px solid var(--card-borda)}
.ib.t{background:var(--tonal);box-shadow:none;border:0}
.link{color:var(--dest);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}

/* ---------- Cartões, chips, linhas ---------- */
.card{background:var(--sup);border-radius:28px;box-shadow:var(--s-card);padding:24px;position:relative;border:1px solid var(--card-borda)}
.card.pd16{padding:16px}
.b{margin-bottom:24px}
.b.t0{margin-top:0}
.stack-gap>*+*{margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;font:600 var(--t-chip)/1.25 var(--ff-x);background:var(--neu-f);color:var(--texto);letter-spacing:.01em}
.chip.q{background:var(--quente);color:var(--dest)}
.chip.ok{background:var(--ok-f);color:var(--ok)}
.chip.al{background:var(--al-f);color:var(--al)}
.chip.er{background:var(--er-f);color:var(--er)}
.chip.in{background:var(--in-f);color:var(--in)}
.chip.sol{background:var(--coral);color:var(--sobre)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;background:var(--tonal);font:600 var(--t-rot)/1.2 var(--ff-x)}
.fchip.on{background:var(--quente);color:var(--dest)}

.tit-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sauda{padding:8px 0 4px}

/* versículo e acordeão */
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 200ms var(--padrao)}
.acc-body>.acc-in{overflow:hidden;min-height:0}
.open>.acc-body,.open .acc-body.me{grid-template-rows:1fr}
.chev{transition:transform 200ms var(--padrao)}
.open>.chev,.open>button .chev,.open .vers-h .chev,.open .res-h .chev{transform:rotate(180deg)}
.vers-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;color:var(--suave);font:500 var(--t-corpo)/1.4 var(--ff-t);font-variation-settings:'SOFT' 100,'WONK' 0}
.vers-txt{padding:4px 0 8px;font-size:calc(18px*var(--fs));line-height:1.55}
.vers-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--suave)}

/* cartão do momento */
.momento{padding:24px;background:var(--sup);overflow:visible;
  background-image:radial-gradient(120% 80% at 100% 0%,rgba(249,178,95,.16),transparent 60%)}
html[data-tema="escuro"] .momento{background-image:radial-gradient(120% 80% at 100% 0%,rgba(244,176,112,.10),transparent 60%)}
.etq-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mom-corpo{display:block;width:100%;text-align:left}
.mom-corpo::after{content:"";position:absolute;inset:0;border-radius:28px}
.mom-corpo .meta{margin-top:4px;color:var(--suave)}
.loc{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--suave);font-size:var(--t-rot);flex-wrap:wrap;position:relative;z-index:1}
.loc .link{min-height:44px}
.parte{margin-top:16px;padding:16px;border-radius:20px;background:var(--sup2);position:relative;z-index:1}
.parte .vl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.mom-acoes{margin-top:16px;position:relative;z-index:1}
.encanto-lin{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ok);font:600 var(--t-leg)/1.35 var(--ff-x);animation:fade 200ms linear both}
.halo{position:absolute;border-radius:56px;pointer-events:none;background:radial-gradient(closest-side,transparent 78%,var(--sol-halo) 90%,transparent 100%);opacity:0;animation:haloanim 1000ms var(--saida) forwards}
#haloLayer{position:absolute;inset:0;z-index:55;pointer-events:none}
.bar-l{display:flex;align-items:center;gap:12px;margin-top:12px}
.bar-t{flex:1;height:12px;border-radius:6px;background:var(--neu-f);overflow:hidden}
.bar-f{height:100%;border-radius:6px;background:var(--ok-ic);transform-origin:left;transition:transform 300ms var(--padrao)}
.num-l{font:600 var(--t-rot)/1 var(--ff-x);font-variant-numeric:tabular-nums}
.lin-l{margin-top:12px;display:flex;gap:8px;align-items:flex-start;font-size:var(--t-rot);line-height:1.4}
.lin-l .ic{margin-top:2px}

/* resumo e aviso */
.res{padding:0}
.res-h{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 24px;text-align:left}
.res-h .tx{flex:1;min-width:0}
.res-h .chev{color:var(--suave)}
.res-lin{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 24px;border-top:1px solid var(--sep);font-size:var(--t-rot);text-align:left}
.res-lin>span{flex:1}
.res-g{padding:12px 24px 4px;font:600 var(--t-leg)/1.3 var(--ff-x);color:var(--suave)}
.res.tudo{display:flex;align-items:center;gap:16px;padding:16px 24px;min-height:72px}
.sunbox{width:56px;height:48px;overflow:hidden;flex:none;display:grid;place-items:end center}
.aviso{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px 12px 20px;border-radius:24px;background:var(--areia);text-align:left}
.aviso>span{flex:1;font-size:var(--t-rot);line-height:1.35}
.aviso .ic{color:var(--dest)}
.aviso .ic:last-child{color:var(--suave)}

/* linhas de lista */
.lista{padding:8px 24px}
.lin{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 0;text-align:left;border-top:1px solid var(--sep)}
.lin:first-child{border-top:0}
.lin .col{flex:1;min-width:0}
.lin .ti{font:600 var(--t-corpo)/1.3 var(--ff-x)}
.lin .sub{font-size:var(--t-leg);color:var(--suave);line-height:1.35}
.tile{width:44px;height:44px;border-radius:14px;background:var(--areia);display:grid;place-items:center;color:var(--dest);flex:none}
.lin>.ic:last-child,.lin>.chev{color:var(--suave)}

/* Agenda */
.ev{position:relative;background:var(--sup);border-radius:28px;box-shadow:var(--s-card);border:1px solid var(--card-borda);padding:16px;margin-bottom:12px}
.ev-t{display:flex;gap:16px;width:100%;text-align:left;align-items:flex-start}
.dia{width:64px;flex:none;border-radius:20px;background:var(--areia);text-align:center;padding:8px 0}
.dia b{display:block;font:600 calc(30px*min(var(--fs),1.5))/1.1 var(--ff-t);font-variant-numeric:tabular-nums}
.dia span{font:600 14px/1.3 var(--ff-x);color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
.ev-c{flex:1;min-width:0}
.ev-c .ti{font:600 var(--t-corpo)/1.3 var(--ff-x)}
.ev-p{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font:600 var(--t-rot)/1.35 var(--ff-x)}
.ev-b{margin-top:12px}
.phone.fg .ev-t{flex-direction:column;gap:8px}
.gr{font:600 calc(20px*min(var(--fs),1.8))/1.25 var(--ff-t);margin:24px 0 12px;font-variation-settings:'SOFT' 100,'WONK' 0}
.gr.first{margin-top:16px}
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--tonal);min-height:56px}
.seg .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:999px;background:var(--sup);box-shadow:0 1px 3px rgba(60,36,16,.2);transition:transform 200ms var(--padrao)}
.seg.t3 .th{width:calc((100% - 8px)/3)}
.seg button{position:relative;flex:1;min-height:48px;border-radius:999px;display:grid;place-items:center;text-align:center;padding:4px 12px;font:500 var(--t-rot)/1.2 var(--ff-x);color:var(--suave)}
.seg button[aria-pressed="true"]{font-weight:600;color:var(--texto)}
.phone.fg .seg{flex-direction:column;border-radius:28px}
.phone.fg .seg .th{display:none}
.phone.fg .seg button[aria-pressed="true"]{background:var(--sup);box-shadow:0 1px 3px rgba(60,36,16,.2)}

/* swipe */
.sw{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--s-card);margin-bottom:12px;background:var(--sup2)}
.sw-bg{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:8px;font:600 var(--t-rot)/1 var(--ff-x)}
.sw-yes{left:0;right:0;padding-left:24px;background:var(--ok-f);color:var(--ok);opacity:0}
.sw-yes.pass{background:var(--ok-ic);color:#fff}
.sw-no{right:0;width:132px;justify-content:center;background:var(--er-f)}
.sw-no .btn{min-height:56px;width:116px;padding:8px;font-size:calc(16px*min(var(--fs),1.3))}
.sw-front{position:relative;background:var(--sup);padding:16px;touch-action:pan-y;border-radius:28px;border:1px solid var(--card-borda);transition:transform 220ms var(--padrao)}
.sw-front .tt{display:block;text-align:left;width:100%;margin-bottom:12px}
.mh{overflow:hidden}

/* Comunidade */
.acoes2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phone.fg .acoes2{grid-template-columns:1fr}
.fixo{display:flex;align-items:center;gap:16px;width:100%;min-height:80px;text-align:left;padding:16px 20px}
.avs{display:flex}
.avs .av{margin-left:-10px;box-shadow:0 0 0 3px var(--sup)}
.avs .av:first-child{margin-left:0}

/* esqueleto */
.sk-wrap{opacity:0;animation:fade 200ms linear 300ms forwards}
.sk{background:var(--esq);border-radius:28px;animation:pulso 1200ms ease-in-out infinite}
.sk+.sk{margin-top:16px}
.sk.l{height:16px;border-radius:8px;margin-top:8px}
.sk.l+.sk.l{margin-top:8px}
.demora{margin-top:16px;padding:16px 24px}

/* vazio e erro */
.vz{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 24px}
.vz p{max-width:300px}
.vz .btn{margin-top:8px}
.er-b{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:24px;border-radius:28px;background:var(--er-f);color:var(--texto)}
.er-b .ti{display:flex;gap:12px;align-items:flex-start;font:600 var(--t-corpo)/1.4 var(--ff-x)}
.er-b .ti .ic{color:var(--er);margin-top:2px}
.er-b.shake{animation:balanco 260ms linear}
.er-b.fadein{animation:fade 160ms var(--padrao) both}

/* telas de pilha */
.top{position:sticky;top:var(--safe);z-index:6;background:var(--papel);display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -24px;padding:8px 24px}
.stack .bar{position:sticky;bottom:0;margin:auto -24px 0;padding:16px 24px 32px;background:linear-gradient(to top,var(--papel) 70%,transparent);z-index:5}
.stack .wrap>.bar{margin-top:auto}
.sp{flex:1;min-height:24px}
.in{animation:push 350ms var(--padrao) both}
.out{animation:pushout 280ms var(--saidaTela) both;pointer-events:none}
.mapa{height:120px;border-radius:20px;background:repeating-linear-gradient(135deg,var(--areia) 0 12px,var(--tonal) 12px 24px);display:grid;place-items:center;color:var(--dest)}

/* Check-in */
.ck-head{position:sticky;top:calc(var(--safe) + 64px);z-index:5;background:var(--papel);margin:0 -24px;padding:8px 24px 12px}
.cnt{display:flex;align-items:center;gap:12px}
.cnt .n{font:600 var(--t-num)/1.1 var(--ff-t);font-variation-settings:'SOFT' 100,'WONK' 0;font-variant-numeric:tabular-nums}
.cnt .n .sw12{display:inline-block;animation:fade 120ms linear both}
.cnt-sun .r{opacity:.35;transform-box:fill-box;transform-origin:center}
.cnt-sun.pop .r{animation:rayon 160ms var(--saida) both;animation-delay:calc(var(--k)*80ms)}
.busca{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 20px;border-radius:20px;background:var(--campo);border:2px solid var(--contorno);margin-top:12px}
.busca input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:400 var(--t-corpo)/1.3 var(--ff-x);min-height:52px}
.busca input::placeholder{color:var(--exemplo);opacity:1}
.busca:focus-within{border-color:var(--foco);box-shadow:0 0 0 4px rgba(181,66,29,.18)}
.ck-row{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 16px;border-radius:24px;background:var(--sup);box-shadow:var(--s-card);border:1px solid var(--card-borda);margin-bottom:8px;text-align:left;transition:background-color 140ms}
.ck-row:active{background:var(--quente)}
.ck-row .col{flex:1;min-width:0}
.ck-row .ti{font:600 var(--t-corpo)/1.3 var(--ff-x)}
.ck-row .sub{font-size:var(--t-leg);color:var(--suave);line-height:1.3}
.ck-row.er-r{background:var(--er-f)}
.ck-row.er-r .sub{color:var(--er);font-weight:600}
.ck-row.shake{animation:balanco 260ms linear}
.ck-go{min-height:44px;padding:8px 20px;border-radius:999px;background:var(--tonal);font:600 var(--t-rot)/1.2 var(--ff-x);display:inline-flex;align-items:center}
.ck-ok{animation:chipin 160ms var(--saida) both}

/* Ao vivo */
.agora{padding:24px;border-radius:28px;background:var(--sup);box-shadow:var(--s-card);border:1px solid var(--card-borda)}
.cron{font:600 var(--t-cron)/1.05 var(--ff-x);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:8px 0}
.etapas-l .lin{min-height:56px;padding:8px 0}
.etapas-l .lin.at{background:var(--quente);margin:0 -16px;padding:8px 16px;border-radius:16px;border-top-color:transparent}
.vv-sw{animation:fade 160ms var(--padrao) both}

/* Cifra */
.cl{display:flex;flex-wrap:wrap;margin-bottom:16px;line-height:1}
.seg-c{display:inline-flex;flex-direction:column}
.seg-c b{font:700 1em/1.4 'Inter',var(--ff-x);color:var(--dest);min-height:1.4em;letter-spacing:.01em}
.seg-c i{font-style:normal;white-space:pre;line-height:1.5}
.cifra{font-size:calc(var(--cf,20px))}
.cifra .rot-s{font:600 var(--t-leg)/1.3 var(--ff-x);color:var(--suave);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl .nm{font:600 var(--t-leg)/1.2 var(--ff-x);min-width:84px}
.ctl .vl{min-width:44px;text-align:center;font:700 var(--t-rot)/1 var(--ff-x);font-variant-numeric:tabular-nums}
.ib.sq{width:44px;height:44px;border-radius:14px}

/* Palco: sempre escuro, alto contraste */
.palco{--papel:#0E0B09;--texto:#FFF6EA;--suave:#D9C9B8;--dest:#FFC29E;--sup:#1C1612;--tonal:#2E251E;--sep:rgba(255,236,214,.16);--sobre:#2A1209;--coral:#F29A74;--coral-p:#E0875F;--contorno:#B7A592;--foco:#FFC29E;background:#0E0B09;color:#FFF6EA}
.palco .seg-c b{color:#FFC29E}

/* sheet, toast, encanto */
#layer{position:absolute;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--veu);animation:fade 200ms linear both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--sup);border-radius:32px 32px 0 0;box-shadow:var(--s-folha);padding:12px 24px 40px;animation:sheetin 360ms var(--saida) both;scrollbar-width:none}
html[data-tema="escuro"] .sheet{background:#332920}
.sheet::-webkit-scrollbar{display:none}
.sheet:focus{outline:none}
#layer.saindo .scrim{animation:fadeout 200ms linear both}
#layer.saindo .sheet{animation:sheetout 220ms var(--saidaTela) both}
.handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--contorno);opacity:.5;margin:0 auto 16px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sh-b{position:sticky;bottom:-40px;margin:24px -24px -40px;padding:16px 24px 40px;background:linear-gradient(to top,var(--sup) 75%,transparent)}
html[data-tema="escuro"] .sh-b{background:linear-gradient(to top,#332920 75%,transparent)}
.opt{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:12px 0;border-top:1px solid var(--sep);text-align:left}
.opt:first-of-type{border-top:0}
.opt .col{flex:1;min-width:0}
.opt .ti{font:600 var(--t-corpo)/1.3 var(--ff-x)}
.opt .sub{font-size:var(--t-leg);color:var(--suave);line-height:1.35}
.opt[disabled]{opacity:1;cursor:not-allowed}
.opt[disabled] .ti{color:var(--suave)}
.cx{width:28px;height:28px;border-radius:9px;border:2px solid var(--contorno);display:grid;place-items:center;flex:none;background:var(--campo);color:transparent}
.cx .ic{width:18px;height:18px;stroke-width:3}
[aria-checked="true"]>.cx{background:var(--coral);border-color:var(--coral);color:var(--sobre)}
.opt[disabled] .cx{border-style:dashed;background:transparent}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font:600 var(--t-leg)/1.2 var(--ff-x);color:var(--suave);padding:8px 0}
.cal button,.cal span.x{min-height:48px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 var(--t-rot)/1 var(--ff-x);font-variant-numeric:tabular-nums;position:relative}
.cal .out{color:transparent}
.cal .hoje{background:var(--coral);color:var(--sobre);font-weight:700}
.cal .ev-d::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--dest);margin-top:4px}
.cal .hoje.ev-d::after{background:var(--sobre)}
.cal .ajd{background:var(--ok-f);color:var(--ok);font-weight:700}
.cal .ajd .ic{width:14px;height:14px;stroke-width:3;margin-top:2px}
#toastWrap{position:absolute;left:12px;right:12px;bottom:112px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#toastWrap.baixo{bottom:32px}
.toast{pointer-events:auto;position:relative;overflow:hidden;background:var(--inv-bg);color:var(--inv-tx);border-radius:24px;box-shadow:var(--s-flut);animation:toastin 200ms var(--saida) both}
.toast.sai{animation:toastout 160ms var(--padrao) both}
.toast-in{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 20px;min-height:64px}
.toast-msg{flex:1;font:500 var(--t-rot)/1.4 var(--ff-x)}
.toast-undo{min-height:48px;padding:8px 16px;border-radius:999px;font:700 var(--t-rot)/1 var(--ff-x);color:var(--inv-ac);text-decoration:underline;text-underline-offset:3px}
.toast-n{font:600 var(--t-leg)/1 var(--ff-x);min-width:36px;opacity:.85;font-variant-numeric:tabular-nums}
.toast-bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--inv-ac);transform-origin:left;transition:transform 10s linear}
.toast :focus-visible{outline-color:var(--inv-ac)}
#encMsg{position:absolute;left:24px;right:24px;top:calc(var(--safe) + 8px);z-index:65;display:flex;gap:12px;align-items:center;padding:12px 20px;border-radius:24px;background:var(--sup);box-shadow:var(--s-flut);border:1px solid var(--card-borda);font:600 var(--t-rot)/1.35 var(--ff-x);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity 200ms linear,transform 200ms var(--saida)}
#encMsg.on{opacity:1;transform:none}
.selo{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:999px;background:var(--ok-f);color:var(--ok);font:700 var(--t-chip)/1.2 var(--ff-x)}
.selo.acende{animation:acende 300ms var(--saida) both}
.pubsol{display:inline-flex;align-items:center;gap:8px}
.pubsol .disc{width:28px;height:28px;border-radius:50%;background:var(--sobre);color:var(--coral);display:grid;place-items:center;animation:clareia 400ms var(--saida) both}

/* ---------- Movimento ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes subir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes chipin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes estoura{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes balanco{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushout{from{transform:none}to{transform:translateX(100%)}}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetout{from{transform:none}to{transform:translateY(100%)}}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastout{from{opacity:1}to{opacity:0}}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(360deg)}}
@keyframes haloanim{0%{opacity:0;transform:scale(.8)}60%{opacity:.35;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes rayon{from{opacity:.35;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes acende{0%{opacity:.4;transform:scale(.96)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes clareia{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes sobeSol{from{opacity:.2;transform:translateY(30px)}to{opacity:1;transform:none}}
.cascata .b{animation:subir 340ms var(--saida) both;animation-delay:calc(var(--i,0)*60ms)}
.tela-fade{animation:fade 160ms var(--padrao) both}
.sun.rise .rise-g{animation:sobeSol 600ms var(--saida) both}
.sun .rs{transform-box:fill-box;transform-origin:center}

/* Reduzir movimento: desloca vira dissolve de 120 ms; nada leva informação só no movimento */
html[data-rm="1"] .cascata .b{animation:fade 120ms linear both;animation-delay:0ms}
html[data-rm="1"] .tela-fade{animation-duration:120ms}
html[data-rm="1"] .in{animation:fade 120ms linear both}
html[data-rm="1"] .out{animation:fadeout 120ms linear both}
html[data-rm="1"] .sheet{animation:fade 120ms linear both}
html[data-rm="1"] #layer.saindo .sheet{animation:fadeout 120ms linear both}
html[data-rm="1"] .btn:active{transform:none;transition-duration:80ms}
html[data-rm="1"] .btn,html[data-rm="1"] .tab-pill,html[data-rm="1"] .seg .th,html[data-rm="1"] .bar-f{transition-property:background-color,opacity;transition-duration:80ms}
html[data-rm="1"] .pop,html[data-rm="1"] .ck-ok{animation:fade 120ms linear both}
html[data-rm="1"] .badge.estoura{animation:none}
html[data-rm="1"] .er-b.shake,html[data-rm="1"] .ck-row.shake{animation:fade 120ms linear both}
html[data-rm="1"] .sk{animation:none}
html[data-rm="1"] .spin{animation:fade 140ms linear 250ms forwards;border-right-color:currentColor;opacity:0}
html[data-rm="1"] .pill.troca .av{animation:none}
html[data-rm="1"] .acc-body,html[data-rm="1"] .chev{transition:none}
html[data-rm="1"] .toast{animation:fade 120ms linear both}
html[data-rm="1"] .toast.sai{animation:fadeout 120ms linear both}
html[data-rm="1"] .toast-bar{display:none}
html[data-rm="1"] #encMsg{transform:none;transition:opacity 120ms linear}
html[data-rm="1"] .selo.acende,html[data-rm="1"] .pubsol .disc{animation:fade 120ms linear both}
html[data-rm="1"] .cnt-sun.pop .r{animation:none;opacity:1}
html[data-rm="1"] .sun.rise .rise-g{animation:none}
html[data-rm="1"] .halo{display:none}
html[data-rm="1"] .sw-front{transition:none}
html[data-rm="1"] .vv-sw{animation-duration:120ms}
</style>
</head>

/* ----- Check-in ----- */
function ckLista(){
  var b=S.busca.trim().toLowerCase(),off=offline();
  function lin(n){
    var p=S.presentes.indexOf(n[0])>=0,e=S.ckErro.indexOf(n[0])>=0,pn=n[0].split(' ')[0];
    var lab=n[0]+(n[1]?', '+n[1].toLowerCase():'')+(p?'. Presente. Toque duas vezes para desfazer.':'. Ainda não chegou. Toque duas vezes para marcar presença.');
    var sub=e?'Não deu para marcar '+pn+'. Toque para tentar de novo.':n[1];
    return '<button type="button" class="ck-row '+(e?'er-r '+(fx('shake_'+n[0])?'shake':''):'')+'" data-a="ck" data-i="'+n[0]+'" aria-pressed="'+p+'" aria-label="'+lab+'">'+av(n[0])+'<span class="col"><span class="ti">'+n[0]+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</span>'+
     (p?chip('ok','check','Presente').replace('chip ok','chip ok '+(fx('chip_'+n[0])?'ck-ok':'')):'<span class="ck-go">Chegou</span>')+'</button>';
  }
  var a=CK_CONV.filter(function(n){return !b||n[0].toLowerCase().indexOf(b)>=0}),o=CK_OUTRAS.filter(function(n){return !b||n[0].toLowerCase().indexOf(b)>=0});
  if(S.estado==='vazio')return '<div class="card">'+vazio(2,'Ninguém convocado ou inscrito.','Procure pelo nome ou leia o QR de quem chegou.',btn('p','Ler QR','sheet:qr'))+'</div>';
  if(!a.length&&!o.length)return '<p class="corpo suave" style="padding:24px 0">Ninguém com esse nome.</p>';
  var h='';
  if(a.length)h+='<h2 class="gr first">Convocados e inscritos ('+CK_CONV.length+')</h2>'+a.map(lin).join('');
  if(o.length)h+='<h2 class="gr">Outras pessoas ('+CK_OUTRAS.length+')</h2>'+o.map(lin).join('');
  return h;
}

/* ----- Ao vivo ----- */
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function folga(){
  var v=S.vivo,E=ETAPAS[v.idx],rest=E.d*60-v.seg;
  if(rest>=0){var m=Math.floor(rest/60);return {t:(m<1?'Menos de 1 min':m+' min')+' de folga',cls:'ok',i:'clock'}}
  var p=Math.max(1,Math.ceil(-rest/60));return {t:'Passou '+p+' min',cls:'er',i:'alert'}
}

function trans(ch,d){
  var F={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
  function mv(r){r=F[r]||r;return NOTAS[(NOTAS.indexOf(r)+d+120)%12]}
  return ch.replace(/^([A-G][#b]?)(.*)$/,function(m,r,s){return mv(r)+s.replace(/\/([A-G][#b]?)/,function(x,b){return '/'+mv(b)})});
}
function cifraHtml(i,cls){
  var m=MUS[i],c=S.cifra[i],K=(NOTAS.indexOf(m.tom)+c.tom+120)%12,SH=(K-c.capo+120)%12,d=(SH-NOTAS.indexOf(m.base)+120)%12,h='<div class="cifra '+(cls||'')+'">';
  m.l.forEach(function(l){
    if(l.r){h+='<p class="rot-s">'+l.r+'</p>';return}
    h+='<div class="cl">'+l.map(function(s){return '<span class="seg-c"><b>'+trans(s[0],d)+'</b><i>'+s[1]+'</i></span>'}).join('')+'</div>';
  });
  return h+'</div>';
}

var lastFocus=null;
function openSheet(html,titulo){
  var L=$('#layer');lastFocus=document.activeElement;
  L.classList.remove('saindo');L.hidden=false;
  L.innerHTML='<div class="scrim" data-a="fechar"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+titulo+'" tabindex="-1"><i class="handle"></i>'+html+'</div>';
  setTimeout(function(){var s=$('.sheet',L);if(s)s.focus({preventScroll:true})},30);
}
function closeSheet(){
  var L=$('#layer');if(L.hidden)return;
  L.classList.add('saindo');
  setTimeout(function(){L.hidden=true;L.innerHTML='';L.classList.remove('saindo');if(lastFocus&&lastFocus.focus&&document.body.contains(lastFocus))lastFocus.focus({preventScroll:true})},S.rm?130:230);
}

 enviarPedido:function(){closeSheet();toast({msg:'Pedido enviado. Você continua na sua parte até alguém assumir.'})},
 radio:function(a,el){$$('.sheet [role="radio"]').forEach(function(r){r.setAttribute('aria-checked',r===el)})}
};
document.addEventListener('click',function(e){
  if(justDragged){e.stopPropagation();e.preventDefault();return}
  var t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  var a=t.dataset.a,i=a.indexOf(':'),n=i<0?a:a.slice(0,i),arg=i<0?'':a.slice(i+1);
  if(ACT[n])ACT[n](arg,t);
},true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('#layer').hidden)closeSheet();else if(S.stack.length)pop()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='ckBusca'){S.busca=e.target.value;var l=$('#ckLista');if(l)l.innerHTML=ckLista()}
  if(e.target.id==='cvBusca'){var b=e.target.value.trim().toLowerCase();$$('#cvTodas .opt').forEach(function(o){o.style.display=(!b||o.dataset.i.toLowerCase().indexOf(b)>=0)?'':'none'})}
});

/* ---------- Deslizar para aceitar ---------- */
var drag=null,justDragged=false;
phone.addEventListener('pointerdown',function(e){
  var f=e.target.closest('.sw-front');if(!f||offline())return;
  drag={f:f,x0:e.clientX,y0:e.clientY,on:false,w:f.offsetWidth,id:e.pointerId,base:f.dataset.open==='1'?-132:0,x:0,pass:false};
});
phone.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dx=(e.clientX-drag.x0)/SC,dy=(e.clientY-drag.y0)/SC;
  if(!drag.on){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.5){drag.on=true;try{drag.f.setPointerCapture(e.pointerId)}catch(_){}drag.f.style.transition='none'}
    else if(Math.abs(dy)>10){drag=null;return}else return;
  }
  var x=Math.max(-132,Math.min(drag.w,drag.base+dx));drag.x=x;drag.f.style.transform='translateX('+x+'px)';
  var yes=drag.f.parentNode.querySelector('.sw-yes'),p=Math.max(0,x)/(drag.w*0.4);yes.style.opacity=Math.min(1,p);
  var pass=p>=1;if(pass!==drag.pass){drag.pass=pass;yes.classList.toggle('pass',pass);if(pass&&navigator.vibrate&&!S.rm){try{navigator.vibrate(8)}catch(_){}}}
});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;var d=drag;drag=null;
  if(!d.on)return;
  justDragged=true;setTimeout(function(){justDragged=false},0);
  var f=d.f;f.style.transition='';
  if(d.x>=d.w*0.4){
    f.style.transform='translateX(100%)';
    setTimeout(function(){aceitar('recepcao')},S.rm?0:200);
  } else if(d.x<-60){f.style.transform='translateX(-132px)';f.dataset.open='1';f.parentNode.querySelector('.sw-yes').style.opacity=0}
  else{f.style.transform='translateX(0)';f.dataset.open='0';f.parentNode.querySelector('.sw-yes').style.opacity=0}
}
phone.addEventListener('pointerup',endDrag);phone.addEventListener('pointercancel',endDrag);

/* ============================================================
   Ajustes (fora da moldura)
   ============================================================ */
function applyTema(){root.dataset.tema=S.tema;$$('[data-aj^="tema:"]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.aj==='tema:'+S.tema)})}
function applyRm(){root.dataset.rm=S.rm?'1':'0';$('#swRm').setAttribute('aria-checked',S.rm)}
function applyFs(){
  root.style.setProperty('--fs',S.fs);$('#vlFs').textContent=S.fs.toFixed(2).replace(/0$/,'').replace('.',',');if(S.fs===1)$('#vlFs').textContent='1,0';
  phone.classList.toggle('fg',S.fs>=1.35);phone.classList.toggle('ab-g',S.fs>=1.1);
}
function applyPapel(){
  $$('[data-aj^="papel:"]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.aj==='papel:'+S.papel)});
  $$('#selMom option[data-lider]').forEach(function(o){o.disabled=S.papel!=='lider'});
  if(S.papel!=='lider'&&(S.momento==='rascunho'||S.momento==='tudo')){S.momento='longe';$('#selMom').value='longe'}
}
function demora(){clearTimeout(demora.t);S.demorou=false;if(S.estado==='carregando')demora.t=setTimeout(function(){S.demorou=true;refresh()},10000)}
$('#ajustes').addEventListener('click',function(e){
  var b=e.target.closest('[data-aj]');if(!b)return;var p=b.dataset.aj.split(':'),k=p[0],v=p[1];
  if(k==='tema'){S.tema=v;applyTema()}
  else if(k==='papel'){S.papel=v;popAll();closeSheet();closeToast(false);applyPapel();renderTab({cascade:true,reset:true});syncChrome()}
  else if(k==='sim'){
    if(v==='aviso'){
      var l=S.notif[S.papel];l.unshift({k:S.papel==='membro'?'lembrete':'entrada',lida:false});FX.estoura=true;refresh();announce('Nova notificação.');
    } else if(v==='banda'){
      S.banda=true;if(!S.bateria.length)S.bateria=['Marcos Pereira'];
      if(!S.vistos.banda){S.vistos.banda=true;FX.banda=true;encantoMsg('Banda completa: 5 de 5.')}
      refresh();
    }
  }
  else if(k==='sol'){sheetSol()}
  else if(k==='encantos'){S.vistos={};toast({msg:'Encantos do sol reiniciados: o próximo de cada tipo toca de novo.'})}
  else if(k==='reset'){var tema=S.tema,rm=S.rm,fs=S.fs,papel=S.papel,mom=S.momento;Object.assign(S,novoEstado());S.vistos={};S.estado='normal';$('#selEst').value='normal';popAll();closeSheet();closeToast(false);refresh();renderTab({cascade:true,reset:true})}
});
$('#swRm').addEventListener('click',function(){S.rm=!S.rm;applyRm()});
$('#rgFs').addEventListener('input',function(e){S.fs=parseFloat(e.target.value);applyFs()});
$('#selMom').addEventListener('change',function(e){S.momento=e.target.value;S.vivo=Object.assign({},novoEstado().vivo);refresh()});
$('#selEst').addEventListener('change',function(e){S.estado=e.target.value;if(S.estado==='erro')FX.shake=true;demora();refresh()});

/* ---------- Relógio do Ao vivo e ajuste de escala ---------- */
setInterval(function(){
  var v=S.vivo;if(!v.ini||v.fim||!v.run)return;
  if(!S.stack.some(function(x){return x.tipo==='aovivo'}))return;
  v.seg++;
  var c=$('#cron'),f=$('#folga');
  if(c)c.textContent=fmt(v.seg);
  if(f){var F=folga();f.className='chip '+F.cls;f.innerHTML=ic(F.i,'xs')+F.t}
},1000);
function fit(){
  var full=window.matchMedia('(max-width:520px)').matches;
  document.body.classList.toggle('full',full);
  var aj=$('#ajustes');
  if(full&&!fit.f)aj.open=false;
  fit.f=full;
  if(full){SC=1;root.style.setProperty('--sc',1)}
  else{aj.open=true;var h=aj.offsetHeight;SC=Math.min(1,(window.innerHeight-h-48)/844);if(SC<0.5)SC=0.5;root.style.setProperty('--sc',SC)}
}
window.addEventListener('resize',fit);

/* ---------- Início ---------- */
applyTema();applyRm();applyFs();applyPapel();fit();
renderTab({cascade:true});syncChrome();
setTimeout(fit,300);
})();
</script>
</body>
</html>
