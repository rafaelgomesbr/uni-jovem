<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uni Jovem, direção A: Aurora Viva (protótipo)</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Uni Jovem, direção A "Aurora Viva": protótipo clicável.
   Autossuficiente: HTML, CSS e JS puros. As fontes do Google são opcionais:
   sem internet, entram Avenir Next, Segoe UI ou a fonte do sistema.
   Movimento: só opacity e transform (exceção declarada: altura do FLIP
   e do acordeão, como no catálogo 6.2 do documento de UX).
   ===================================================================== */
:root{
  --e-saida:cubic-bezier(.22,1,.36,1);--e-padrao:cubic-bezier(.4,0,.2,1);--e-sai:cubic-bezier(.4,0,1,1);
  --e-mola:cubic-bezier(.34,1.45,.5,1);--e-nasce:cubic-bezier(.16,1,.3,1);
  --f-tit:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-txt:Inter,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(900px 520px at 72% -8%,rgba(255,138,101,.16),transparent 62%),
             radial-gradient(800px 640px at -4% 34%,rgba(124,108,255,.18),transparent 62%),#06051a;
  color:#E4E0FA;font:14px/1.4 var(--f-txt);min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:not-allowed}
input,select{font:inherit}
ul{list-style:none}

/* ---------- barra da demonstração (fora da moldura) ---------- */
.barra-demo{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;
  background:rgba(8,6,28,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1);font-size:13px}
.barra-demo .marca{font:800 15px var(--f-tit);color:#fff;margin-right:4px}
.barra-demo .marca small{font:500 12px var(--f-txt);color:#B9B3E4;margin-left:6px}
.barra-demo .g{display:flex;align-items:center;gap:8px;color:#C9C4EC}
.barra-demo .g>span{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#A7A2D0}
.sg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08)}
.sg button{min-height:32px;padding:0 12px;border-radius:999px;color:#C9C4EC;font-weight:500}
.sg button[aria-pressed=true]{background:rgba(255,138,101,.22);color:#FFB199;font-weight:600}
.barra-demo select{min-height:34px;border-radius:10px;background:#1c1942;color:#F5F3FF;border:1px solid #4a4580;padding:0 8px}
.barra-demo input[type=range]{accent-color:#FF8A65;width:120px}
.sw{width:44px;height:26px;border-radius:999px;border:2px solid #7C77A8;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#7C77A8;transition:transform .2s}
.sw[aria-checked=true]{background:#FF8A65;border-color:#FF8A65}
.sw[aria-checked=true]::after{transform:translateX(18px);background:#1A0F0A}
.barra-demo .ac{min-height:32px;padding:0 10px;border-radius:999px;background:rgba(179,168,255,.16);color:#F5F3FF;font-weight:600}
.barra-demo .ac:hover{background:rgba(179,168,255,.26)}
.barra-demo small#rm-txt{max-width:260px;color:#B9B3E4;font-size:12px;line-height:1.25}
#btn-ctrl{display:none}

/* ---------- palco da página ---------- */
.palco-demo{display:flex;justify-content:center;align-items:flex-start;gap:36px;padding:18px 16px 40px}
.lateral{width:250px;flex:none;color:#C9C4EC;font-size:13px}
.lateral h2{font:800 16px var(--f-tit);color:#fff;margin-bottom:8px}
.lateral p{margin-bottom:12px;line-height:1.4}
.poses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pose-card{padding:8px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center}
.pose-card b{display:block;font-size:12px;color:#fff;margin-top:2px}
.pose-card span{display:block;font-size:11.5px;color:#B9B3E4;line-height:1.25}
.lateral .ac{margin-top:10px;min-height:36px;padding:0 14px;border-radius:999px;background:rgba(255,138,101,.2);color:#FFB199;font-weight:600}
.aparelho-caixa{flex:none}
.aparelho{width:390px;height:844px;transform-origin:top left}

/* ================= a moldura do celular ================= */
.frame{
  --fs:1;--fd:min(var(--fs),1.6);
  --e-saida:cubic-bezier(.22,1,.36,1);--e-padrao:cubic-bezier(.4,0,.2,1);--e-sai:cubic-bezier(.4,0,1,1);
  --e-mola:cubic-bezier(.34,1.45,.5,1);--e-nasce:cubic-bezier(.16,1,.3,1);
  position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;isolation:isolate;
  background:var(--fundo);color:var(--texto);font-family:var(--f-txt);font-size:16px;line-height:1.5;
  box-shadow:0 0 0 9px #14122f,0 0 0 10px #2f2b60,0 40px 90px rgba(0,0,0,.65);
  -webkit-font-smoothing:antialiased;
}
.frame[data-tema=escuro]{
  --fundo:#12102A;--fundo2:#0C0A20;--texto:#F5F3FF;--suave:#C9C4EC;--destaque:#FFB199;
  --coral:#FF8A65;--coral-p:#F0764F;--coral-topo:#FF9A78;--coral-base:#FF8A65;--sobre:#1A0F0A;
  --cartao:rgba(38,33,82,.64);--cartao-op:#1F1B44;--cartao-borda:rgba(255,255,255,.14);--realce:rgba(255,255,255,.06);
  --mom-topo:#342C6E;--mom-base:#221D4E;--borda1:#FF8A65;--borda2:#9D8FFF;--borda3:#5B4BDB;
  --tonal:rgba(179,168,255,.16);--tonal-p:rgba(179,168,255,.26);--tonal-op:#373262;--trilho:rgba(255,255,255,.08);
  --sep:rgba(255,255,255,.09);--esq:rgba(255,255,255,.08);--veu:rgba(8,6,24,.62);
  --ok:#7FE0B0;--ok-bg:rgba(127,224,176,.16);--al:#FFD166;--al-bg:rgba(255,209,102,.16);
  --er:#FF8A8A;--er-bg:rgba(255,138,138,.16);--info:#B3A8FF;--info-bg:rgba(157,143,255,.16);
  --quente-bg:rgba(255,177,153,.16);--neutro-bg:rgba(255,255,255,.10);
  --foco:#FF8A65;--halo:rgba(255,138,101,.22);--aba-ativa:rgba(255,138,101,.20);--aba-glow:rgba(255,138,101,.45);
  --vidro:rgba(24,21,58,.78);--vidro-cab:rgba(18,16,42,.78);--vidro-borda:rgba(255,255,255,.16);--vidro-op:#1B1840;
  --folha:rgba(38,34,80,.92);--folha-op:#262250;--campo:#322F4C;--campo-borda:#7C77A8;--campo-ex:#A7A2D0;
  --toast:#2E2A66;--toast-t:#F5F3FF;--toast-a:#FFB199;
  --aceitar-bg:#17513B;--recusar-bg:#432D4F;
  --sombra-cartao:none;--sombra-hero:0 24px 48px -14px rgba(8,4,40,.7),0 0 70px -22px rgba(255,138,101,.38);
  --sombra-botao:0 6px 16px rgba(255,138,101,.28);--realce-botao:rgba(255,255,255,.30);
  --sombra-flut:0 12px 32px rgba(0,0,0,.40);--sombra-folha:0 -8px 40px rgba(0,0,0,.5);
  --g-coral:rgba(255,138,101,.55);--g-violeta:rgba(124,108,255,.45);--g-hz:rgba(255,160,110,.40);--g-po:rgba(214,80,150,.38);
  --gp-coral:rgba(255,138,101,.33);--gp-violeta:rgba(124,108,255,.27);
  --sol-topo:#FFD166;--sol-base:#FF8A65;--sol-raio:#FFD166;--sol-barra:#FFEBDD;--sol-halo-c:#FF8A65;
  --palco-bg:#07061A;
}
.frame[data-tema=claro]{
  --fundo:#F7F5FF;--fundo2:#EFEBFF;--texto:#1B1838;--suave:#4B4670;--destaque:#8A2E12;
  --coral:#C2491F;--coral-p:#A93D18;--coral-topo:#C64B20;--coral-base:#B5431B;--sobre:#FFFFFF;
  --cartao:rgba(255,255,255,.80);--cartao-op:#FFFFFF;--cartao-borda:rgba(27,24,56,.09);--realce:rgba(255,255,255,.0);
  --mom-topo:#FFFFFF;--mom-base:#F1ECFF;--borda1:#C2491F;--borda2:#7C6CFF;--borda3:#4B3FC4;
  --tonal:rgba(75,63,196,.12);--tonal-p:rgba(75,63,196,.20);--tonal-op:#E9E8F8;--trilho:rgba(27,24,56,.06);
  --sep:rgba(27,24,56,.09);--esq:#ECE9F8;--veu:rgba(27,24,56,.42);
  --ok:#16794B;--ok-bg:#E3F4EA;--al:#8A5A00;--al-bg:#FFF1D6;
  --er:#B42318;--er-bg:#FDE4E1;--info:#4B3FC4;--info-bg:#ECEAFD;
  --quente-bg:#FFE3D9;--neutro-bg:#EEEBFA;
  --foco:#C2491F;--halo:rgba(194,73,31,.18);--aba-ativa:rgba(194,73,31,.12);--aba-glow:rgba(194,73,31,.25);
  --vidro:rgba(255,255,255,.82);--vidro-cab:rgba(247,245,255,.82);--vidro-borda:rgba(27,24,56,.10);--vidro-op:#FFFFFF;
  --folha:rgba(255,255,255,.94);--folha-op:#FFFFFF;--campo:#F3F1FA;--campo-borda:#857FAF;--campo-ex:#6B6690;
  --toast:#1F1B4D;--toast-t:#F5F3FF;--toast-a:#FFB199;
  --aceitar-bg:#E3F4EA;--recusar-bg:#FDE4E1;
  --sombra-cartao:0 1px 2px rgba(27,24,56,.06),0 8px 20px rgba(27,24,56,.07);
  --sombra-hero:0 20px 44px -14px rgba(75,63,196,.30),0 2px 6px rgba(27,24,56,.06);
  --sombra-botao:0 6px 14px rgba(194,73,31,.30);--realce-botao:rgba(255,255,255,.22);
  --sombra-flut:0 12px 32px rgba(27,24,56,.16);--sombra-folha:0 -8px 40px rgba(27,24,56,.20);
  --g-coral:rgba(255,138,101,.30);--g-violeta:rgba(124,108,255,.22);--g-hz:rgba(255,170,120,.30);--g-po:rgba(214,80,150,.20);
  --gp-coral:rgba(255,138,101,.18);--gp-violeta:rgba(124,108,255,.13);
  --sol-topo:#E8890C;--sol-base:#C2491F;--sol-raio:#B86E00;--sol-barra:#8A2E12;--sol-halo-c:#FF8A65;
  --palco-bg:#07061A;
}
.frame *{box-sizing:border-box}
.frame :focus{outline:none}
.frame :focus-visible{outline:2px solid var(--foco);outline-offset:2px;box-shadow:0 0 0 6px var(--halo)}
.frame ::selection{background:var(--halo)}

/* ---------- tipografia (papéis do app) ---------- */
.t-d{font:800 calc(34px*var(--fd))/1.12 var(--f-tit);letter-spacing:-.5px}
.t-tt{font:800 calc(28px*min(var(--fs),1.8))/1.14 var(--f-tit);letter-spacing:-.3px}
.t-tc{font:800 calc(26px*min(var(--fs),2))/1.15 var(--f-tit);letter-spacing:-.2px}
.t-num{font:800 calc(40px*min(var(--fs),1.6))/1 var(--f-tit);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.t-it{font:600 calc(16px*var(--fs))/1.38 var(--f-txt)}
.t-co{font:400 calc(16px*var(--fs))/1.5 var(--f-txt)}
.t-me{font:400 calc(15px*var(--fs))/1.35 var(--f-txt)}
.t-le{font:400 calc(14px*var(--fs))/1.4 var(--f-txt)}
.t-so{font:600 calc(13px*min(var(--fs),1.6))/1.4 var(--f-txt);letter-spacing:1px;text-transform:uppercase}
.suave{color:var(--suave)}.dest{color:var(--destaque)}
.tab{font-variant-numeric:tabular-nums}

/* ---------- fundo Aurora (camadas só de transform e opacity) ---------- */
.aurora{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,var(--fundo) 0%,var(--fundo) 55%,var(--fundo2) 100%)}
.luz{position:absolute;border-radius:50%;will-change:transform,opacity}
.luz.coral{width:380px;height:380px;right:-140px;top:-160px;opacity:var(--cor-op);transform:translate(var(--cx),var(--cy)) scale(var(--cs));
  transition:opacity .9s var(--e-nasce),transform .9s var(--e-nasce)}
.luz.coral .d{background:radial-gradient(circle,var(--g-coral) 0%,transparent 70%)}
.luz.violeta{width:360px;height:360px;left:-160px;top:120px}
.luz.violeta .d{background:radial-gradient(circle,var(--g-violeta) 0%,transparent 70%)}
.luz.hz{left:-70px;right:-70px;bottom:-190px;height:380px;opacity:var(--hz-op);transform:translateY(var(--hz-y));
  transition:opacity .9s var(--e-nasce),transform .9s var(--e-nasce)}
.luz.hz .d{background:radial-gradient(ellipse at 50% 58%,var(--g-hz) 0%,transparent 68%)}
.luz.po{left:-70px;right:-70px;bottom:-190px;height:380px;opacity:var(--po-op);transform:translateY(var(--hz-y));
  transition:opacity .9s var(--e-nasce),transform .9s var(--e-nasce)}
.luz.po .d{background:radial-gradient(ellipse at 50% 58%,var(--g-po) 0%,transparent 68%)}
.luz .d{position:absolute;inset:0;border-radius:inherit}
.luz.coral .d{animation:deriva-c 14s ease-in-out 6 alternate}
.luz.violeta .d{animation:deriva-v 18s ease-in-out 6 alternate}
@keyframes deriva-c{to{transform:translate(-14px,12px) scale(1.06);opacity:.9}}
@keyframes deriva-v{to{transform:translate(16px,-10px) scale(1.05);opacity:.92}}
/* o sol sobe com o relógio: cada momento reposiciona a luz (nasce, esquenta, poente) */
.frame{--cx:0px;--cy:0px;--cs:1;--cor-op:.85;--hz-op:.30;--po-op:0;--hz-y:70px}
.frame[data-m=longe]{--cor-op:.85;--hz-op:.30;--po-op:0;--hz-y:70px;--cs:1}
.frame[data-m=vespera]{--cor-op:.92;--hz-op:.45;--po-op:0;--hz-y:36px;--cs:1.03}
.frame[data-m=dia]{--cor-op:1;--hz-op:.65;--po-op:0;--hz-y:6px;--cs:1.06;--cy:6px}
.frame[data-m=agora]{--cor-op:1;--hz-op:.95;--po-op:0;--hz-y:-26px;--cs:1.12;--cy:10px;--cx:-10px}
.frame[data-m=fim]{--cor-op:.7;--hz-op:.15;--po-op:.95;--hz-y:44px;--cs:.96}

/* ---------- telas, cabeçalho, corpo ---------- */
.view{position:absolute;inset:0;z-index:2}
.tela{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;display:flex;flex-direction:column}
.tela::-webkit-scrollbar{display:none}
.tela>.cab{flex:none}
.tela>.corpo{flex:1 0 auto}
/* telas de pilha: a Aurora a 60% da intensidade (a mesma geometria), para o slide não mostrar a tela de baixo */
.tela.push{background:radial-gradient(circle at 340px 30px,var(--gp-coral),transparent 188px),
  radial-gradient(circle at 20px 300px,var(--gp-violeta),transparent 178px),linear-gradient(180deg,var(--fundo),var(--fundo2))}
.tela>.barra-fixa,.tela>.ao-btns{position:sticky;bottom:0;margin-top:auto;flex:none}
.cab{position:sticky;top:0;z-index:20;padding:44px 20px 4px}
.cab::before{content:"";position:absolute;inset:0;background:var(--vidro-cab);backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);opacity:0;transition:opacity .2s var(--e-padrao);border-bottom:1px solid var(--sep);z-index:-1}
.cab.rolou::before{opacity:1}
.cab-l{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.pil-com{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--tonal);
  border:1px solid var(--cartao-borda);max-width:calc(100% - 64px)}
.av-c{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;
  font:800 13px var(--f-tit);transition:transform .2s var(--e-padrao)}
.pil-com .nm{font:600 calc(16px*min(var(--fs),1.4))/1.2 var(--f-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .16s var(--e-padrao)}
.pil-com .ic{flex:none;color:var(--suave)}
.pil-com.troca .av-c{animation:girar .2s var(--e-padrao)}
.pil-com.troca .nm{animation:dissolver .16s var(--e-padrao)}
.sino{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.sino .selo{position:absolute;top:0;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--coral);color:var(--sobre);
  font:700 12px/20px var(--f-txt);text-align:center;font-variant-numeric:tabular-nums}
.sino .selo.estoura{animation:estoura .16s var(--e-saida)}
.status{display:flex;align-items:center;gap:6px;min-height:24px;padding:0 4px;color:var(--suave);font:400 calc(13px*min(var(--fs),1.4))/1.3 var(--f-txt)}
.status .ic{color:var(--ok)}
.corpo{padding:8px 20px 120px}
.corpo.push{padding-bottom:40px}
.corpo>*+*{margin-top:16px}
.corpo>h1{margin-top:4px}
.corpo>.grupo{margin-top:24px}
.btn-vlt{width:44px;height:44px;border-radius:50%;background:var(--tonal);display:grid;place-items:center;flex:none}
.cab-push{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.cab-push .dir{display:flex;gap:8px;align-items:center}
.faixa{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--al-bg);color:var(--texto);font:400 calc(14px*var(--fs))/1.35 var(--f-txt)}
.faixa .ic{flex:none;color:var(--al)}

/* ---------- botões (linguagem de controles-v2, evoluída) ---------- */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:6px 20px;
  border-radius:999px;font:600 calc(16px*min(var(--fs),2))/1.25 var(--f-txt);text-align:center;user-select:none;
  transition:transform .22s var(--e-mola)}
.btn.g{min-height:56px;padding:6px 24px}
.btn.c{min-height:40px;padding:4px 16px}
.btn.c::after{content:"";position:absolute;inset:-4px}
.btn:active:not(:disabled){transform:scale(.98);transition-duration:.09s;transition-timing-function:ease-out}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .16s;z-index:-1}
.btn:active:not(:disabled)::before{opacity:1}
.btn.p{background:linear-gradient(180deg,var(--coral-topo),var(--coral-base)) var(--coral);color:var(--sobre);
  box-shadow:var(--sombra-botao),inset 0 1px 0 var(--realce-botao)}
.btn.p::before{background:var(--coral-p)}
.btn.s{background:var(--tonal);color:var(--texto)}
.btn.s::before{background:var(--tonal-p)}
.btn.t{color:var(--destaque);padding:4px 12px;min-height:44px}
.btn.t::before{background:var(--quente-bg)}
.btn.d{background:var(--er-bg);color:var(--er)}
.btn.dc{background:var(--er);color:#2A0A0A}
.btn.full{width:100%}
.btn:disabled.p{background:var(--quente-bg);color:var(--destaque);opacity:.78;box-shadow:none}
.btn:disabled.s{opacity:.7;color:var(--suave)}
.btn:disabled.t{opacity:.5}
.btn .ic{flex:none}
.btn.balanca{animation:balanca .26s linear}
.par{display:flex;gap:12px}
.par>.btn{flex:1}
.fg .par{flex-direction:column-reverse}
.fg .par>.btn{width:100%}
.motivo{display:flex;align-items:flex-start;gap:6px;margin-top:8px;color:var(--suave);font:400 calc(14px*var(--fs))/1.4 var(--f-txt)}
.motivo .ic{flex:none;margin-top:2px}

/* ---------- cartões, chips, linhas ---------- */
.cartao{position:relative;border-radius:22px;background:var(--cartao);border:1px solid var(--cartao-borda);box-shadow:var(--sombra-cartao)}
.cartao::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,var(--realce),transparent 42%);pointer-events:none}
.cartao.pad{padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:4px 10px;border-radius:999px;
  font:600 calc(13px*min(var(--fs),1.6))/16px var(--f-txt);white-space:nowrap}
.c-q{background:var(--quente-bg);color:var(--destaque)}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-al{background:var(--al-bg);color:var(--al)}
.c-er{background:var(--er-bg);color:var(--er)}
.c-in{background:var(--info-bg);color:var(--info)}
.c-n{background:var(--neutro-bg);color:var(--suave)}
.chip.pop{animation:pop .2s var(--e-mola) both}
.linha{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;text-align:left}
.linha.g{min-height:72px}
.linha .tx{flex:1;min-width:0}
.linha .tx b{display:block;font:600 calc(16px*var(--fs))/1.35 var(--f-txt)}
.linha .tx small{display:block;color:var(--suave);font:400 calc(14px*var(--fs))/1.4 var(--f-txt)}
.linha .seta{flex:none;color:var(--suave)}
.linha+.linha{border-top:1px solid var(--sep)}
.lado{display:flex;align-items:center;gap:10px}
.ladrilho{flex:none;width:32px;height:32px;border-radius:10px;background:var(--quente-bg);color:var(--destaque);display:grid;place-items:center}
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-tit);font-weight:800}
.pilha-av{display:flex}.pilha-av .av{border:2px solid var(--cartao-op);margin-left:-8px}.pilha-av .av:first-child{margin-left:0}
.prog{height:6px;border-radius:99px;background:var(--trilho);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--coral);border-radius:99px;transform-origin:left;transition:transform .5s var(--e-nasce)}
.sep{height:1px;background:var(--sep);margin:14px 0}
.acord{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--e-padrao)}
.acord.on{grid-template-rows:1fr}
.acord>div{overflow:hidden;min-height:0}
.seta-g{transition:transform .2s var(--e-padrao)}
[aria-expanded=true] .seta-g{transform:rotate(180deg)}
h2.sec{font:600 calc(16px*var(--fs))/1.4 var(--f-txt);margin:0 0 8px}
h2.sec span{color:var(--suave);font-weight:400}

/* ---------- o cartão do momento ---------- */
.hero{position:relative;border-radius:28px;padding:1.5px;background:linear-gradient(140deg,var(--borda1),var(--borda2) 55%,var(--borda3));box-shadow:var(--sombra-hero)}
.hero .in{position:relative;border-radius:26.5px;overflow:hidden;padding:18px 20px 20px;background:linear-gradient(160deg,var(--mom-topo),var(--mom-base))}
.hero .brilho{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 100% 0%,rgba(255,138,101,.26),transparent 55%)}
.hero .sol-c{position:absolute;right:6px;top:2px;pointer-events:none}
.hero .topo{position:relative;padding-right:78px;min-height:84px}
.hero .eti{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;color:var(--destaque)}
.hero h2{margin:0}
.hero .meta{margin-top:2px;color:var(--suave)}
.hero .corpo-h{position:relative;margin-top:14px}
.hero .parte{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.hero .parte b{font:600 calc(16px*var(--fs))/1.35 var(--f-txt)}
.hero .acoes{margin-top:14px}
.hero .link-c{display:inline-flex;align-items:center;gap:6px;color:var(--destaque);font:600 calc(15px*var(--fs))/1.3 var(--f-txt);min-height:32px}
.hero .halo1{position:absolute;right:-30px;top:-40px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,102,.55),rgba(255,138,101,.25) 40%,transparent 70%);pointer-events:none;animation:halo-nasce 1s var(--e-nasce) both}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);animation:live 1.6s ease-in-out infinite}
.enc-linha{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--quente-bg);color:var(--texto);
  font:600 calc(15px*var(--fs))/1.35 var(--f-txt);overflow:hidden;animation:entrar .2s var(--e-saida) both}
.enc-linha .ic{color:var(--destaque);flex:none}
.hero .enc-linha{margin-top:12px}
.bloco-erro{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:18px;border-radius:22px;background:var(--er-bg);color:var(--texto);animation:dissolver .16s both}
.bloco-erro .ic{color:var(--er)}
.bloco-erro p{font:400 calc(16px*var(--fs))/1.45 var(--f-txt)}
.vazio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 16px}
.vazio h3{font:800 calc(22px*min(var(--fs),1.8))/1.2 var(--f-tit)}
.vazio p{color:var(--suave);max-width:290px}
.obrigado{display:flex;align-items:center;gap:10px;color:var(--texto);font:600 calc(16px*var(--fs))/1.35 var(--f-txt)}

/* versículo */
.vers{margin-top:0}
.vers-b{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;color:var(--suave);font:400 calc(15px*var(--fs))/1.4 var(--f-txt);text-align:left}
.vers-b .vt{flex:1;min-width:0}
.vers-b .vt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}
[aria-expanded=true] .vt{white-space:normal;font-style:italic}
.vers .ler{padding-bottom:4px}

/* ---------- linha de resposta com deslizar ---------- */
.linha-resp{position:relative;border-radius:20px;overflow:hidden;background:var(--cartao-op);border:1px solid var(--cartao-borda);transform:translateZ(0)}
.linha-resp .fundo{position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;font:600 calc(15px*var(--fs))/1.3 var(--f-txt);opacity:0;transition:opacity .12s}
.linha-resp .fa{background:var(--aceitar-bg);color:var(--ok);gap:8px;justify-content:flex-start}
.linha-resp .fa span{color:var(--texto)}
.linha-resp .fr{background:var(--recusar-bg);justify-content:flex-end}
.linha-resp.dir .fa{opacity:1}
.linha-resp.esq .fr,.linha-resp.aberta .fr{opacity:1}
.linha-resp.passou .fa{filter:brightness(1.15)}
.linha-resp .frente{position:relative;background:var(--cartao-op);padding:12px 16px 14px;touch-action:pan-y;transition:transform .25s var(--e-saida)}
.linha-resp .frente.arrasta{transition:none}
.linha-resp .tt{display:block;width:100%;text-align:left;min-height:44px}
.linha-resp .tt b{display:block;font:600 calc(16px*var(--fs))/1.35 var(--f-txt)}
.linha-resp .tt small{display:block;color:var(--suave);font:400 calc(14px*var(--fs))/1.4 var(--f-txt)}
.linha-resp .par{margin-top:8px}
.linha-resp.saindo{transition:opacity .2s var(--e-padrao),max-height .2s var(--e-padrao),margin .2s var(--e-padrao);opacity:0;max-height:0!important;margin-top:0!important}

/* ---------- agenda ---------- */
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--trilho);min-height:48px;border:1px solid var(--cartao-borda)}
.seg .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:999px;background:var(--quente-bg);
  transform:translateX(calc(var(--i)*100%));transition:transform .2s var(--e-padrao)}
.seg button{position:relative;flex:1;min-height:40px;padding:0 10px;border-radius:999px;color:var(--suave);font:500 calc(15px*min(var(--fs),1.8))/1.2 var(--f-txt);text-align:center}
.seg button[aria-checked=true]{color:var(--destaque);font-weight:600}
.fg .seg:not(.fixo){flex-direction:column;border-radius:22px}
.fg .seg:not(.fixo) .th{display:none}
.fg .seg:not(.fixo) button[aria-checked=true]{background:var(--quente-bg)}
.linha-ev{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px 16px;text-align:left;border-radius:22px}
.dia{flex:none;width:56px;padding:8px 0 6px;border-radius:16px;background:var(--tonal);text-align:center}
.dia b{display:block;font:800 calc(26px*min(var(--fs),1.5))/1 var(--f-tit);font-variant-numeric:tabular-nums}
.dia span{display:block;margin-top:2px;color:var(--suave);font:600 calc(12px*min(var(--fs),1.5))/1.2 var(--f-txt);letter-spacing:.8px}
.fg .linha-ev{flex-direction:column}
.ev-box{overflow:hidden;border-radius:22px}
.ev-t{flex:1;min-width:0}
.ev-t h3{font:600 calc(17px*var(--fs))/1.3 var(--f-txt)}
.ev-t p{color:var(--suave);font:400 calc(15px*var(--fs))/1.35 var(--f-txt)}
.ev-t .voce{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--texto);font:600 calc(15px*var(--fs))/1.3 var(--f-txt)}
.ev-ac{padding:0 16px 14px}
.topo-ag{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filtros{display:flex;gap:10px;align-items:center}
.filtros .seg{flex:1}
.pedem{display:flex;align-items:center;gap:12px;padding:12px 16px}

/* ---------- barra de abas flutuante ---------- */
.bar{position:absolute;left:16px;right:16px;bottom:12px;height:68px;border-radius:34px;z-index:30;display:flex;padding:6px;
  background:var(--vidro);border:1px solid var(--vidro-borda);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:var(--sombra-flut);transition:transform .28s var(--e-saida),opacity .2s}
.bar.oculta{transform:translateY(130%);opacity:0;pointer-events:none}
.bar .pil{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:28px;background:var(--aba-ativa);
  box-shadow:inset 0 0 0 1px var(--aba-glow),0 0 22px -6px var(--aba-glow);transform:translateX(calc(var(--i)*100%));
  transition:transform .26s cubic-bezier(.34,1.3,.5,1)}
.bar button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:28px;color:var(--suave);
  font:500 calc(11px*min(var(--fs),1.6))/1.2 var(--f-txt)}
.bar button[aria-current=page]{color:var(--destaque);font-weight:600}
.bar button .ic{transition:transform .26s var(--e-mola)}
.bar button[aria-current=page] .ic{transform:translateY(-1px) scale(1.06)}
.fg2 .bar button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- folhas, scrim, toasts ---------- */
.scrim{position:absolute;inset:0;background:var(--veu);opacity:0;pointer-events:none;z-index:50;transition:opacity .2s var(--e-padrao)}
.scrim.on{opacity:1;pointer-events:auto}
.folha{position:absolute;left:0;right:0;bottom:0;max-height:90%;z-index:60;border-radius:28px 28px 0 0;background:var(--folha);
  backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);border:1px solid var(--vidro-borda);border-bottom:0;
  box-shadow:var(--sombra-folha);display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;
  transition:transform .24s var(--e-sai),visibility 0s .24s}
.folha.on{transform:none;visibility:visible;transition:transform .34s var(--e-saida),visibility 0s}
.folha .pega{width:40px;height:5px;border-radius:99px;background:var(--sep);background:var(--neutro-bg);margin:8px auto 0;flex:none}
.folha .cf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px 4px}
.folha .cf h2{font:800 calc(22px*min(var(--fs),1.8))/1.2 var(--f-tit)}
.folha .cp{overflow-y:auto;padding:8px 20px 12px;scrollbar-width:none;flex:1}
.folha .cp::-webkit-scrollbar{display:none}
.folha .rd{padding:10px 20px 28px;border-top:1px solid var(--sep);flex:none}
.toasts{position:absolute;left:16px;right:16px;bottom:var(--tb,96px);z-index:70;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;border-radius:20px;background:var(--toast);color:var(--toast-t);padding:6px 6px 6px 16px;
  display:flex;align-items:center;gap:8px;min-height:52px;box-shadow:var(--sombra-flut);animation:toast-in .2s var(--e-saida) both;
  font:400 calc(15px*var(--fs))/1.35 var(--f-txt)}
.toast.sai{animation:toast-out .16s var(--e-padrao) both}
.toast .tx{flex:1;min-width:0;padding:6px 0}
.toast .cont{flex:none;color:#C9C4EC;font-variant-numeric:tabular-nums;font-size:calc(14px*var(--fs))}
.toast .btn-d{flex:none;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;color:var(--toast-a);font:700 calc(15px*var(--fs))/1.2 var(--f-txt)}
.toast .btn-d:active{background:rgba(255,255,255,.1)}
.toast .barra{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--toast-a);transform-origin:left;animation:contagem 10s linear forwards}

/* ---------- esqueleto ---------- */
.esq-wrap{opacity:0;animation:dissolver .16s var(--e-padrao) .3s forwards}
.esq{background:var(--esq);border-radius:14px;animation:pulso 1.2s ease-in-out infinite}
.esq.r{border-radius:99px}
.esq-col{display:flex;flex-direction:column;gap:16px}

/* ---------- check-in ---------- */
.ck-top{position:sticky;top:96px;z-index:10;padding:10px 0 12px;margin:0 -20px;padding-left:20px;padding-right:20px;background:var(--vidro-cab);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ck-cont{display:flex;align-items:baseline;gap:10px;position:relative}
.ck-cont .n{display:inline-block}
.ck-cont .n.troca{animation:dissolver .12s both}
.ck-cont .arco{position:absolute;left:-8px;top:-14px;width:72px;height:60px;pointer-events:none}
.ck-cont .arco i{position:absolute;left:50%;top:50%;width:5px;height:14px;margin:-7px 0 0 -2.5px;border-radius:3px;background:var(--al);opacity:0;
  transform:rotate(var(--r)) translateY(-30px)}
.ck-cont .arco.vai i{animation:raio-arco .22s var(--e-saida) forwards;animation-delay:calc(var(--k)*50ms)}
.ck-row{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:10px 16px;text-align:left}
.ck-row+.ck-row{border-top:1px solid var(--sep)}
.ck-row .tx{flex:1;min-width:0}
.ck-row .tx b{display:block;font:600 calc(16px*var(--fs))/1.3 var(--f-txt)}
.ck-row .tx small{display:block;color:var(--suave);font:400 calc(14px*var(--fs))/1.3 var(--f-txt)}
.ck-row:active{background:var(--tonal)}
.ck-row .chip.pop{animation:pop-ck .16s var(--e-saida) both}
@keyframes pop-ck{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.rm .ck-row .chip.pop{animation:none!important}
.campo{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:16px;background:var(--campo);border:1px solid var(--campo-border,var(--campo-borda));color:var(--suave)}
.campo input{flex:1;min-width:0;background:none;border:0;color:var(--texto);font:400 calc(16px*min(var(--fs),2))/1.4 var(--f-txt);outline:none;padding:12px 0}
.campo input::placeholder{color:var(--campo-ex)}
.campo:focus-within{border-color:var(--foco);box-shadow:0 0 0 2px var(--foco),0 0 0 6px var(--halo)}
.barra-fixa{z-index:25;padding:12px 16px 24px;display:flex;gap:12px;background:var(--vidro);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--vidro-borda)}
.barra-fixa .btn{flex:1}
.barra-fixa .btn.p{flex:2}

/* ---------- ao vivo ---------- */
.agora{padding:20px;border-radius:28px;background:linear-gradient(160deg,var(--mom-topo),var(--mom-base));border:1.5px solid var(--borda2);position:relative;overflow:hidden}
.agora .cron{font:800 calc(64px*min(var(--fs),1.4))/1.05 var(--f-tit);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.agora .arco-sol{position:absolute;right:-18px;top:-12px;pointer-events:none}
.ao-btns{padding:12px 16px 24px;background:var(--vidro);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--vidro-borda);display:flex;flex-direction:column;gap:10px}
.ao-btns .btn{min-height:56px}
.ao-btns .lin{display:flex;gap:12px}
.ao-btns .lin .btn:first-child{flex:1}
.ao-btns .lin .btn.p{flex:2}
.fg .ao-btns .lin{flex-direction:column-reverse}

/* ---------- convocar, cifra, diversos ---------- */
.cv{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 4px;text-align:left}
.cv+.cv{border-top:1px solid var(--sep)}
.cv .tx{flex:1;min-width:0}
.cv .tx b{display:block;font:600 calc(16px*var(--fs))/1.3 var(--f-txt)}
.cv .tx small{display:block;color:var(--suave);font:400 calc(14px*var(--fs))/1.3 var(--f-txt)}
.cv:disabled{opacity:.72}
.cx{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--campo-borda);display:grid;place-items:center;color:var(--sobre)}
.cv.on .cx{background:var(--coral);border-color:var(--coral)}
.cv:disabled .cx{border-style:dashed}
.rad{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--campo-borda);display:grid;place-items:center}
.rad.on{border-color:var(--coral)}.rad.on::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--coral)}
.cl{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:8px;margin-bottom:14px}
.sgm{display:inline-flex;flex-direction:column}
.acorde{font-weight:800;color:var(--destaque);min-height:1.3em;font-size:.92em}
.lt{white-space:pre-wrap}
.cifra{font-size:calc(var(--tam)*1px*var(--fs));line-height:1.35}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.ctl .btn{flex:1;min-width:72px}
.palco{position:absolute;inset:0;z-index:80;background:var(--palco-bg);color:#fff;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.palco.on{opacity:1;visibility:visible;transition:opacity .2s}
.palco .acorde{color:#FFB199}
.palco .corpo-p{flex:1;overflow-y:auto;padding:16px 24px;scrollbar-width:none}
.palco .topo-p{padding:50px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.palco .base-p{padding:12px 16px 24px;display:flex;gap:8px;border-top:1px solid rgba(255,255,255,.16)}
.palco .btn.s{background:rgba(255,255,255,.14);color:#fff}
.sol-bloco{display:block;margin:0 auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{color:var(--suave);font:600 13px/2 var(--f-txt)}
.cal button{min-height:44px;border-radius:12px;font:600 calc(15px*min(var(--fs),1.5))/1 var(--f-txt);font-variant-numeric:tabular-nums;position:relative}
.cal button.tem::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--coral)}
.cal button.hoje{background:var(--coral);color:var(--sobre)}
.cal button.pode{background:var(--ok-bg);color:var(--ok)}
.cal button.pode .ic{position:absolute;right:3px;top:3px}
.cal button:active{background:var(--tonal)}
.sw-f{flex:none;width:52px;height:32px;border-radius:99px;border:2px solid var(--campo-borda);position:relative;transition:background .15s}
.sw-f::after{content:"";position:absolute;top:7px;left:7px;width:14px;height:14px;border-radius:50%;background:var(--campo-borda);transition:transform .2s var(--e-mola)}
.sw-f[aria-checked=true]{background:var(--coral);border-color:var(--coral)}
.sw-f[aria-checked=true]::after{transform:translateX(20px) scale(1.55);background:var(--sobre)}
.etapa{display:flex;gap:14px;align-items:center;min-height:48px;padding:6px 0}
.etapa .h{flex:none;width:52px;color:var(--suave);font-variant-numeric:tabular-nums;font:600 calc(15px*var(--fs))/1.3 var(--f-txt)}
.etapa+.etapa{border-top:1px solid var(--sep)}
.sub-sol{display:flex;align-items:center;gap:8px}
.selo-banda{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font:600 calc(14px*var(--fs))/1.2 var(--f-txt)}
.selo-banda.acende{animation:acende .3s var(--e-saida) both}
.tudo-sol{overflow:hidden;display:inline-block;border-radius:6px;vertical-align:middle}
.tudo-sol .sol{display:block}
.sobe-sol{animation:sobe-sol .6s var(--e-nasce) both}
.circ-sol{position:relative;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center}
.circ-sol::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(255,209,102,.7),transparent 70%);opacity:0}
.circ-sol.clareia::before{animation:clareia .4s var(--e-saida) both}

function cifraLinha(l,n){
  var out='',ac=null;
  l.split(/(\[[^\]]+\])/).forEach(function(p){
    if(!p)return;
    if(p.charAt(0)==='['){if(ac!==null)out+=seg(ac,' ',n);ac=p.slice(1,-1)}
    else{out+=seg(ac,p,n);ac=null}
  });
  if(ac!==null)out+=seg(ac,' ',n);
  return '<div class="cl">'+out+'</div>';
}
function seg(ac,t,n){return '<span class="sgm"><b class="acorde">'+(ac===null?' ':esc(trans(ac,n)))+'</b><span class="lt">'+esc(t)+'</span></span>'}
function cifraTom(m){var n=S.cifra.tom;return {soa:trans(m.tom,n),toque:trans(m.forma,n)}}

    case 'ck':marcarCk(g);break;
    case 'marcarTodos':marcarTodos();break;
    case 'cv':{var i=S.conv.sel.indexOf(g);if(i>=0)S.conv.sel.splice(i,1);else S.conv.sel.push(g);
      var lc=$('#lista-cv',folhaEl);var sc=$('.cp',folhaEl).scrollTop;if(lc)lc.innerHTML=listaConv();$('.cp',folhaEl).scrollTop=sc;var rp=$('#rodape-cv',folhaEl);if(rp)rp.innerHTML=rodapeConv();break}
    case 'cvok':{var sel2=S.conv.sel.slice();if(!sel2.length)break;S.bateria=sel2;fecharFolha();refresh();
      toast({txt:sel2.length+(sel2.length===1?' pessoa convocada.':' pessoas convocadas.'),desfazer:function(){S.bateria=[];refresh()}});break}
    case 'dia':{var d=+g;if(S.modoAjuda){S.poderia[d]=!S.poderia[d];montarFolha();var cp=$('#sw-ajuda',folhaEl);break}
      fecharFolha();var alvo=$('[data-dia="'+d+'"]',cur);if(alvo&&cur.dataset.id==='agenda'){alvo.scrollIntoView({behavior:opc.rm?'auto':'smooth',block:'center'});info('Mostrando '+d+' de nov.')}else info('Nenhum encontro neste dia.');break}
    case 'modoAjuda':S.modoAjuda=!S.modoAjuda;montarFolha();break;
    case 'subOp':S.subOp=+g;montarFolha();break;
    case 'subOk':fecharFolha();toast({txt:'Pedido enviado. Você continua na sua parte até alguém assumir.',dur:5});break;
    case 'cancelarOk':fecharFolha();toast({txt:'Encontro cancelado. 11 pessoas avisadas.',dur:4});break;
    case 'publicar':publicar();break;
    case 'trocaCom':trocaComunidade(g);break;
    case 'tentar':tentar();break;
    case 'sair':{if(!S.sairArm){S.sairArm=true;refresh();setTimeout(function(){if(S.sairArm){S.sairArm=false;if(cur&&cur.dataset.id==='perfil')refresh()}},4000)}else{S.sairArm=false;refresh();info('Você saiu. Seus dados neste aparelho foram apagados.')}break}
    case 'lerTodas':itensNotif().forEach(function(x,i){S.lidas[S.papel+i]=1});refresh();break;
    case 'notifItem':{var idx=+g;S.lidas[S.papel+idx]=1;
      if(!ehLider()&&idx===0){voltar();setTimeout(function(){irAba('inicio')},0);break}
      refresh();info('Esta notificação abriria a tela correspondente.');break}
    case 'chegouAviso':break;
    case 'musica':S.cifra={i:+g,tom:0,tam:S.cifra.tam};empurrar('cifra');break;
    case 'tom':{S.cifra.tom=((S.cifra.tom+(+g))%12+12)%12;if(S.cifra.tom>6)S.cifra.tom-=12;redesenhaCifra();break}
    case 'tam':{S.cifra.tam=Math.max(14,Math.min(30,S.cifra.tam+2*(+g)));redesenhaCifra();break}
    case 'mus':{var ni=S.cifra.i+(+g);if(ni>=0&&ni<MUS.length){S.cifra={i:ni,tom:0,tam:S.cifra.tam};redesenhaCifra(true)}break}
    case 'palco':abrirPalco();break;
    case 'sairPalco':fecharPalco();break;
    case 'aoIniciar':S.ao.ini=true;S.ao.etapa=0;S.ao.seg=0;S.ao.fim=false;refresh();break;
    case 'aoProxima':case 'aoPular':if(a==='aoPular')fecharFolha();if(S.ao.etapa<6){S.ao.etapa++;S.ao.seg=0;refresh()}break;
    case 'aoVoltar':fecharFolha();if(S.ao.etapa>0){S.ao.etapa--;S.ao.seg=0;refresh()}break;
    case 'aoPausa':S.ao.pausa=!S.ao.pausa;refresh();break;
    case 'aoEncerrar':{fecharFolha();var prev=JSON.parse(JSON.stringify(S.ao));S.ao.fim=true;refresh();toast({txt:'Encontro encerrado.',desfazer:function(){S.ao=prev;refresh()}});break}
  }
});
function redesenhaCifra(){
  if(palcoEl.classList.contains('on')){palcoEl.innerHTML=palcoH();return}
  refresh();
}
function abrirPalco(){palcoEl.innerHTML=palcoH();palcoEl.classList.add('on');palcoEl.setAttribute('aria-hidden','false');setTimeout(function(){var b=$('button',palcoEl);if(b)b.focus()},60)}
function fecharPalco(){palcoEl.classList.remove('on');palcoEl.setAttribute('aria-hidden','true');if(cur&&cur.dataset.id==='cifra')refresh()}
palcoEl.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,g=el.dataset.arg;
  if(a==='sairPalco')fecharPalco();
  else if(a==='tam'){S.cifra.tam=Math.max(14,Math.min(30,S.cifra.tam+2*(+g)));palcoEl.innerHTML=palcoH()}
  else if(a==='mus'){var ni=S.cifra.i+(+g);if(ni>=0&&ni<MUS.length){S.cifra={i:ni,tom:0,tam:S.cifra.tam};palcoEl.innerHTML=palcoH()}}
});
scrim.addEventListener('click',fecharFolha);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(palcoEl.classList.contains('on'))fecharPalco();else if(folhaAberta)fecharFolha()}});
frame.addEventListener('input',function(e){
  if(e.target.id==='ck-q'){S.ckQ=e.target.value;var l=$('#lista-ck',cur);if(l)l.innerHTML=listaCk()}
  if(e.target.id==='cv-q'){S.conv.q=e.target.value;var lc=$('#lista-cv',folhaEl);if(lc)lc.innerHTML=listaConv()}
});

/* ----- deslizar para aceitar (com botão equivalente sempre visível) ----- */
var sw=null;
frame.addEventListener('pointerdown',function(e){
  var f=e.target.closest('.linha-resp .frente');
  if(!f||e.target.closest('.par'))return;
  var row=f.parentNode;if(row.classList.contains('saindo'))return;
  var r=row.getBoundingClientRect();
  sw={f:f,row:row,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,w:r.width,k:(r.width/(row.offsetWidth||r.width))||1,t:0,aberta:row.classList.contains('aberta')};
});
window.addEventListener('pointermove',function(e){
  if(!sw||e.pointerId!==sw.id)return;
  var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.on){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.5){sw.on=true;try{sw.f.setPointerCapture(e.pointerId)}catch(x){}sw.f.classList.add('arrasta')}
    else if(Math.abs(dy)>10){sw=null;return}
  }
  if(sw.on){
    var base=sw.aberta?-sw.w*0.34:0,t=Math.max(-sw.w*0.38,Math.min(sw.w*0.55,base+dx));sw.t=t;
    sw.f.style.transform='translateX('+(t/sw.k)+'px)';
    sw.row.classList.toggle('dir',t>4);sw.row.classList.toggle('esq',t<-4);sw.row.classList.toggle('passou',t>sw.w*0.4);
  }
});
function fimDeslizar(e){
  if(!sw||(e&&e.pointerId!==sw.id))return;
  var s=sw;sw=null;if(!s.on)return;
  s.f.classList.remove('arrasta');
  if(s.t>s.w*0.4){s.f.style.transform='translateX(110%)';var q=+s.row.dataset.q;setTimeout(function(){aceitar(q)},opc.rm?0:120)}
  else if(s.t<-s.w*0.2){s.f.style.transform='translateX(-'+(0.34*s.w/s.k)+'px)';s.row.classList.add('aberta');s.row.classList.remove('dir');s.row.classList.add('esq')}
  else{s.f.style.transform='';s.row.classList.remove('dir','esq','passou','aberta')}
}
window.addEventListener('pointerup',fimDeslizar);window.addEventListener('pointercancel',fimDeslizar);

(function(){
  var box=$('#poses');
  POSES.forEach(function(p){var d=document.createElement('button');d.className='pose-card';d.dataset.pose=p[0];d.innerHTML=sol(p[0],72)+'<b>'+p[1]+'</b><span>'+p[2]+'</span>';box.appendChild(d)});

},1000);

/* ===================== escala da moldura em telas baixas ===================== */
function ajustar(){
  var ap=$('#aparelho'),cx=$('#caixa');
  if(window.innerWidth<=520){ap.style.transform='';cx.style.width='';cx.style.height='';return}
  var topo=$('#demo').offsetHeight,k=Math.min(1,(window.innerHeight-topo-44)/844);
  ap.style.transform='scale('+k+')';cx.style.width=(390*k)+'px';cx.style.height=(844*k)+'px';
}
window.addEventListener('resize',ajustar);

/* ===================== início ===================== */
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){opc.rm=true;document.body.classList.add('rm');$('#sw-rm').setAttribute('aria-checked','true')}
textoRm();ajustar();
trocar(montar('inicio',true),'aba');
setTimeout(ajustar,300);
})();
